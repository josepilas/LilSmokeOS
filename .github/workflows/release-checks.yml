name: Alpha Release Checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release gate unit tests
        run: python -m unittest discover -s tools/release -v
      - name: Version and license
        run: |
          test "$(cat VERSION)" = "Alpha-0.0.1"
          cmp LICENSE LICENSES/MPL-2.0.txt
          python tools/release/check_license_text.py
          python tools/release/check_license_scope.py
      # No create-release/upload step: image and private-port clearance is pending.
