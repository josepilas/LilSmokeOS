# LilSmokeOS default configuration for VirtualBox x86_64
#
# This file is copied to /persist/config/lilsmoke.conf on first boot.
# The user (or LilSmokeUI Settings menu) edits it to change behavior.
#
# VBox-specific notes:
#   - SSH is enabled by default (useful for dev). Set SSH_ENABLED=0
#     if you want to mimic real-HW behavior.
#   - WiFi is left off — VBox provides wired NAT networking instead.
#   - EMULATOR_PS1 is set to pcsx_rearmed because the MIPS dynarec
#     in PCSX4ALL doesn't run on x86_64. On real HW this is set to
#     pcsx4all (the MIPS-to-MIPS dynarec).

# --- Version ---
LILSMOKE_VERSION="0.7.0-j9"
LILSMOKE_TARGET="vbox-x86_64"

# --- Network ---
WIFI_ENABLED=0          # VBox uses wired NAT; no WiFi dongle emulated
WIFI_IPV4="dhcp"
SSH_ENABLED=1           # ON by default for VBox dev (off on real HW)
HOSTNAME="lilsmoke"

# --- USB OTG (VirtualBox has no emulated device-side UDC) ---
USB_MODE="off"
USB_NETWORK_ADDRESS="192.168.7.1"

# --- Display ---
DISPLAY_WIDTH=640
DISPLAY_HEIGHT=480
DISPLAY_ROTATION=0      # 0, 90, 180, 270
SCALING_MODE="integer"  # "integer" | "stretch" | "aspect"
SHOW_FPS=0              # 1 = show FPS overlay in games
SHOW_CLOCK=0            # 1 = show the theme's clock widget
SHOW_BATTERY="text"     # "off" | "icon" | "text"

# --- Audio ---
MASTER_VOLUME=70
MUSIC_VOLUME=60
SFX_VOLUME=80

# --- Frontend ---
DEFAULT_THEME="default"
SCAN_ROMS_ON_BOOT=0     # 1 = re-scan /storage/roms on every boot
COVER_ART_SIZE="320x240"
ASSET_CACHE_MB=16       # max RAM for cover art cache (Lite preset uses 8)
POINTER_ENABLED=on
POINTER_SPEED="normal" # "slow" | "normal" | "fast"
CURSOR_SIZE=32

# --- Emulation ---
SAVE_STATE_COMPRESSION=1
REWIND_BUFFER_MB=4      # 0 = disabled (saves RAM)
AUTO_SAVE_ON_EXIT=1

# PS1 emulator selection. On MIPS targets (qemu-mipsel, sf3000, gb350)
# we use pcsx4all (the rkgame reconstruction with MIPS dynarec). On
# x86_64 (VBox) the MIPS dynarec won't run, so we fall back to the
# libretro pcsx_rearmed core via RetroArch. The lilsmoke-launch
# script reads this variable to pick which path to take for PS1 ROMs.
EMULATOR_PS1="pcsx_rearmed"

# --- Power ---
LCD_BRIGHTNESS=80       # No effect on VBox (no backlight control)
SCREEN_TIMEOUT=0        # 0 = never, N = seconds of no input
AUTO_SLEEP_MINUTES=0    # 0 = never

# --- Performance ---
ZRAM_ENABLED=on
ZRAM_SIZE_MB=48
CPU_GOVERNOR="ondemand" # "ondemand" | "performance" | "powersave"
CPU_OVERCLOCK=stock     # "stock" | "1300MHz" | "1400MHz" (no-op without CPUFreq)
CPU_STOCK_MAX_KHZ=1200000
CPU_MAX_TEMP_C=78
CPU_THERMAL_THROTTLE_C=82
CPU_THERMAL_POLL_SECONDS=10
CPU_ALLOW_UNMONITORED_OVERCLOCK=0
