# LilSmokeOS — ISOLINUX config for VirtualBox x86_64 ISO
#
# ISOLINUX is the bootloader used on El Torito bootable ISOs. It loads
# the Linux kernel (bzImage) and the initramfs (rootfs.cpio.gz) into
# memory and jumps to the kernel entry point.
#
# The ISO is built by board/vbox-x86_64/post-image.sh using
# genisoimage with the -b isolinux/isolinux.bin option.
#
# vga=785 selects VESA mode 0x311 = 640x480x16. Use 788 for 640x480x32.
# We use 785 because DirectFB's VESA driver is happiest at 16bpp on
# the VBox emulated VBE, and our internal pixel format is 16-bit RGB565
# anyway (LilSmokeUI uses 32-bit BGRA for textures, but the final blit
# to fbdev is 16-bit — saves bandwidth).
#
# References:
#   https://wiki.syslinux.org/wiki/index.php?title=ISOLINUX
#   https://wiki.syslinux.org/wiki/index.php?title=Display

DEFAULT lilsmoke
PROMPT 0
TIMEOUT 10

LABEL lilsmoke
    KERNEL /boot/bzImage
    APPEND initrd=/boot/rootfs.cpio.gz console=tty0 console=ttyS0,115200n8 root=/dev/ram0 rdinit=/init vga=785 lilsmoke.slot=A

# Optional fallback label — boots with a serial-only console (no tty0).
# Useful when debugging kernel hangs that happen before tty0 initializes.
LABEL lilsmoke-serial
    KERNEL /boot/bzImage
    APPEND initrd=/boot/rootfs.cpio.gz console=ttyS0,115200n8 root=/dev/ram0 rdinit=/init vga=785 lilsmoke.slot=A

# Optional debug label — boots with verbose kernel logging.
LABEL lilsmoke-debug
    KERNEL /boot/bzImage
    APPEND initrd=/boot/rootfs.cpio.gz console=tty0 console=ttyS0,115200n8 root=/dev/ram0 rdinit=/init vga=785 lilsmoke.slot=A ignore_loglevel printk.debugy=y
