# LilSmokeOS default configuration for SF3000 (real hardware)
#
# This file is copied to /persist/config/lilsmoke.conf on first boot.
# The user (or LilSmokeUI Settings menu) edits it to change behavior.

# --- Version ---
LILSMOKE_VERSION="0.7.0-j9"
LILSMOKE_TARGET="sf3000"

# --- Network ---
WIFI_ENABLED=0          # 1 = start wpa_supplicant at boot (requires USB dongle)
WIFI_IPV4="dhcp"        # "dhcp" or a static address/prefix, e.g. 192.168.1.50/24
SSH_ENABLED=0           # 1 = start dropbear on any active network
HOSTNAME="lilsmoke"

# --- USB OTG ---
# Requires a peripheral-capable UDC. The service stays off safely otherwise.
USB_MODE="off"          # "off" | "network" | "drive" | "network+drive"
USB_NETWORK_ADDRESS="192.168.7.1"

# --- Display ---
DISPLAY_WIDTH=854       # native SF3000 panel width
DISPLAY_HEIGHT=480
DISPLAY_ROTATION=0      # 0, 90, 180, 270 (GB350 uses 90 by default)
SCALING_MODE="integer"  # "integer" | "stretch" | "aspect"
SHOW_FPS=0              # 1 = show FPS overlay in games
SHOW_CLOCK=0            # 1 = show the theme's clock widget
SHOW_BATTERY="text"     # "off" | "icon" | "text"

# --- Audio ---
MASTER_VOLUME=70
MUSIC_VOLUME=60
SFX_VOLUME=80

# --- Frontend ---
DEFAULT_THEME="default"
SCAN_ROMS_ON_BOOT=0     # 1 = re-scan /storage/roms on every boot
COVER_ART_SIZE="320x240"
ASSET_CACHE_MB=16       # max RAM for cover art cache (Lite preset uses 8)
POINTER_ENABLED=on      # USB mouse and controller touchpad cursor
POINTER_SPEED="normal" # "slow" | "normal" | "fast"
CURSOR_SIZE=32          # 24, 32, 40, or 48 pixels

# --- Emulation ---
SAVE_STATE_COMPRESSION=1
REWIND_BUFFER_MB=4      # 0 = disabled (saves RAM)
AUTO_SAVE_ON_EXIT=1
# SF3000 uses PCSX4ALL (the rkgame reconstruction with MIPS dynarec).
EMULATOR_PS1="pcsx4all"

# --- Power ---
LCD_BRIGHTNESS=80
SCREEN_TIMEOUT=0        # 0 = never, N = seconds of no input
AUTO_SLEEP_MINUTES=0    # 0 = never

# --- Performance ---
ZRAM_ENABLED=on         # optional; Settings can apply this immediately
ZRAM_SIZE_MB=48
CPU_GOVERNOR="ondemand" # "ondemand" | "performance" | "powersave"
CPU_OVERCLOCK=stock     # "stock" | "1300MHz" | "1400MHz" (requires CPUFreq + thermal)
CPU_STOCK_MAX_KHZ=1188000
CPU_MAX_TEMP_C=78       # restore overclock at/below this temperature
CPU_THERMAL_THROTTLE_C=82 # drop back to stock at/above this temperature
CPU_THERMAL_POLL_SECONDS=10
CPU_ALLOW_UNMONITORED_OVERCLOCK=0

# Optional adapter-dependent Bluetooth; off until explicitly enabled.
BLUETOOTH_ENABLED=off
