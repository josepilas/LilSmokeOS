# LilSmokeOS — RetroArch default configuration
#
# Tuned for the SF3000/GB350 family:
#   - DirectFB video driver (no GPU)
#   - ALSA audio driver
#   - SDL2/DirectFB keyboard input plus Linux joypads
#   - runtime framebuffer size, 4:3 game viewport, integer scale by default
#   - 32MB rewind buffer (off by default — can be toggled in UI)
#   - Saves to /persist/saves, states to /persist/states

# --- Paths ---
libretro_directory = "/usr/lib/libretro"
core_options_path = "/persist/config/retroarch-core-options.cfg"
content_directory = "/storage/roms"
savefile_directory = "/persist/saves"
savestate_directory = "/persist/states"
screenshot_directory = "/persist/screenshots"
playlist_directory = "/persist/playlists"
thumbnails_directory = "/persist/thumbnails"

# --- Drivers ---
video_driver = "sdl2"
audio_driver = "alsa"
input_driver = "sdl2"
libretro_info_path = "/usr/share/libretro/info"
core_info_cache_enable = false

# SF3000 HC16xx serializer-keyboard mapping. Joypad button mappings below
# remain available for USB pads and the QEMU test harness.
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "ctrl"
input_player1_b = "alt"
input_player1_x = "space"
input_player1_y = "shift"
input_player1_l = "tab"
input_player1_r = "backspace"
input_player1_l2 = "pageup"
input_player1_r2 = "pagedown"
input_player1_select = "escape"
input_player1_start = "enter"
input_joypad_driver = "linuxraw"
menu_driver = "rgui"
camera_driver = "null"
location_driver = "null"

# --- Video ---
video_fullscreen = true
video_windowed_fullscreen = true
video_scale = 2
video_smooth = false
video_scale_integer = true
video_aspect_ratio_auto = false
video_aspect_ratio = 1.3333
video_vsync = true
video_max_swapchain_images = 2
video_hard_sync = false
video_threaded = false
video_font_path = "/usr/share/fonts/dejavu/DejaVuSans.ttf"
video_font_size = 12
video_message_pos_x = 0.05
video_message_pos_y = 0.05
video_message_color = 0xD9C9A3FF
video_crop_overscan = false

# --- Audio ---
audio_enable = true
audio_sync = true
audio_max_timing_skew = 0.05
audio_sample_rate = 44100
audio_out_rate = 44100
audio_latency = 64
audio_block_frames = 0
audio_volume = 0.7
audio_mixer_volume = 0.7
audio_rate_control_delta = 0.005

# --- Input ---
input_max_users = 2
input_autodetect_enable = true
input_overlay_enable = false
input_overlay_scale = 1.0
input_overlay_opacity = 0.7
input_poll_type_behavior = 1
input_menu_toggle_gamepad_combo = 0
input_remap_binds_enable = true

# Default gamepad mapping (Linux evdev key codes)
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "10"
input_r3_btn = "11"
input_menu_toggle_btn = "12"

# --- Menu (RGUI — minimal, fast on MIPS) ---
menu_show_core_updater = false
menu_show_online_updater = false
menu_show_load_core = true
menu_show_load_content = true
menu_show_information = true
menu_show_configurations = true
quick_menu_show_save_load_state = true
quick_menu_show_savestate_submenu = false
menu_savestate_resume = false
notification_show_save_state = true
sort_savestates_enable = true
sort_savestates_by_content_enable = true
savestates_in_content_dir = false
menu_show_take_screenshot = true
menu_show_quit = true
menu_show_reboot = true
menu_show_shutdown = true
rgui_show_start_screen = false
rgui_background_filler_thickness = 1
rgui_menu_color_theme = "custom"
rgui_entry_normal_color = 0xD9C9A3FF
rgui_entry_hover_color = 0xFFFFFFFF
rgui_title_color = 0xD9C9A3FF
rgui_bg_dark_color = 0x2B2D31FF
rgui_bg_light_color = 0x1E2A47FF
rgui_border_dark_color = 0x1F3D2BFF
rgui_border_light_color = 0x1F3D2BFF

# --- Performance ---
video_frame_delay = 0
audio_latency = 64
input_max_users = 1
fastforward_ratio = 5.0
rewind_enable = false
rewind_buffer_size = 32
rewind_granularity = 2
savestate_auto_index = false
savestate_max_keep = 5
savefile_directory = "/persist/saves"
savestate_directory = "/persist/states"

# --- Misc ---
pause_nonactive = false
video_disable_composition = false
ui_companion_start_on_boot = false
webcam_enable = false
camera_allow = false
core_set_supports_no_game_enable = true
check_firmware_before_loading = false
video_shared_context = false
